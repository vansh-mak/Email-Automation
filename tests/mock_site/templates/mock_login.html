<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Email Login</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 40px; margin: 0; }
    .card { max-width: 450px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 32px; }
    h1 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
    #inbox-view { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-form">
      <h1>Sign In to Mock Gmail</h1>
      <div class="form-group">
        <label for="login_username">Email or phone</label>
        <input type="text" id="login_username" name="login_username" autocomplete="off" />
      </div>
      <div class="form-group">
        <label for="login_password">Password</label>
        <input type="password" id="login_password" name="login_password" autocomplete="off" />
      </div>
      <button type="button" id="btn-login-submit">Sign in</button>
    </div>

    <div id="inbox-view">
      <h2 style="color: #166534; margin-top: 0;">Inbox</h2>
      <p id="user-badge" style="color: #15803d; font-weight: 500;">Signed in</p>
      <p style="color: #64748b; font-size: 13px;">Welcome to your email dashboard.</p>
    </div>
  </div>

  <script>
    document.getElementById('btn-login-submit').addEventListener('click', () => {
      const user = document.getElementById('login_username').value.trim();
      const pwd = document.getElementById('login_password').value.trim();
      if (user && pwd) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('user-badge').textContent = `Signed in as ${user}`;
        document.getElementById('inbox-view').style.display = 'block';
      } else {
        alert('Please enter username and password');
      }
    });
  </script>
</body>
</html>
